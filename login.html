

<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#7965d8">

  <title>Login — PROCURE FINDER</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

  <main class="login-card">

    <div class="login-brand">

      <span class="brand-mark">P.</span>

      <span class="brand-name">

        <strong>PROCURE</strong>

        <small>FINDER</small>

      </span>

    </div>

    <h1>Welcome Back!</h1>

    <p>

      Login untuk mengakses Client Acquisition System

      dan mengelola peluang bisnis Anda.

    </p>

    <form id="loginForm" class="login-form">

      <div class="field">

        <label for="email">Email Address</label>

        <input

          type="email"

          id="email"

          placeholder="Masukkan email"

          autocomplete="username"

          required

        >

      </div>

      <div class="field">

        <label for="password">Password</label>

        <input

          type="password"

          id="password"

          placeholder="Masukkan password"

          autocomplete="current-password"

          required

        >

      </div>

      <div id="loginMessage" class="login-message"></div>

      <button type="submit" class="primary-button" id="loginButton">

        Login to Workspace →

      </button>

    </form>

    <div class="login-footer">

      PROCURE FINDER © 2026<br>

      Find Opportunities. Build Connections.

    </div>

  </main>

  <script type="module">

    import { createClient } from

      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =

      "https://inskhhkztoganifgbhrt.supabase.co";

    const SUPABASE_KEY =

      "sb_publishable_Aa6oBTaQZGKLs8SZw9m-Lw_RhRXSkoU";

    const supabase = createClient(

      SUPABASE_URL,

      SUPABASE_KEY

    );

    const loginForm = document.getElementById("loginForm");

    const loginButton = document.getElementById("loginButton");

    const loginMessage = document.getElementById("loginMessage");

    // Jika sudah login, langsung masuk dashboard

    const { data } = await supabase.auth.getSession();

    if (data.session) {

      window.location.replace("/");

    }

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      loginButton.disabled = true;

      loginButton.textContent = "Checking account...";

      loginMessage.textContent = "";

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      try {

        const { error } = await supabase.auth.signInWithPassword({

          email,

          password

        });

        if (error) throw error;

        window.location.replace("/");

      } catch (error) {

        loginMessage.textContent =

          error.message || "Login gagal. Periksa email dan password.";

        loginButton.disabled = false;

        loginButton.textContent = "Login to Workspace →";

      }

    });

  </script>

</body>

</html>
